services:
  - type: web
    name: ssslst-backend
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: "./build.sh"
    startCommand: "./start.sh"
    healthCheckPath: /admin/login/
    # No persistent disk (free plan). SQLite is ephemeral and lives in the app
    # directory; seed data is repopulated on every startup by data migrations.
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      # Comma-separated allowed hosts. RENDER_EXTERNAL_HOSTNAME is added
      # automatically by the settings, so this can stay blank if you like.
      - key: ALLOWED_HOSTS
        value: ""
      # Your Vercel frontend origin (no trailing slash).
      - key: FRONTEND_URL
        value: https://ssslst-website-psi.vercel.app
      # Optional integrations — set real values in the dashboard if used.
      - key: YOUTUBE_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
