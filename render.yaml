services:
  - type: web
    name: ssslst-backend
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: "./build.sh"
    startCommand: "./start.sh"
    healthCheckPath: /admin/login/
    disk:
      name: sqlite-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      # SQLite lives on the persistent disk mounted at /var/data
      - key: SQLITE_PATH
        value: /var/data/db.sqlite3
      - key: MEDIA_ROOT
        value: /var/data/media
      # Comma-separated allowed hosts. RENDER_EXTERNAL_HOSTNAME is added
      # automatically by the settings, so this can stay blank if you like.
      - key: ALLOWED_HOSTS
        value: ""
      # Your Vercel frontend origin (no trailing slash).
      - key: FRONTEND_URL
        value: https://ssslst-website-psi.vercel.app
      # Optional integrations — set real values in the dashboard if used.
      - key: YOUTUBE_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
