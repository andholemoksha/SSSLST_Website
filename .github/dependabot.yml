# Automated dependency + security updates for the frontend.
# Dependabot opens PRs when dependencies are out of date or have known
# vulnerabilities. Free, zero-maintenance — part of a production review setup.
version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      # batch minor/patch bumps into one PR to reduce noise
      minor-and-patch:
        update-types:
          - minor
          - patch
